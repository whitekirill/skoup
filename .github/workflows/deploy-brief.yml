# Сервис брифа: изменения в server/ или deploy/brief/ в main → test; кнопка с target=production → прод.
# Код уходит на шлюз gw, оттуда на brim; образ собирается и запускается там (deploy/bin/skoup-deploy-brief).
name: Deploy brief service

on:
  push:
    branches: [main]
    paths:
      - 'server/**'
      - 'deploy/brief/**'
  workflow_dispatch:
    inputs:
      target:
        description: Куда выложить
        type: choice
        options: [test, production]
        default: test

concurrency:
  group: deploy-brief-${{ inputs.target || 'test' }}
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: ${{ inputs.target || 'test' }}
    env:
      TARGET: ${{ inputs.target == 'production' && 'prod' || 'test' }}
    steps:
      - uses: actions/checkout@v4

      - name: SSH key
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}

      - name: Upload
        run: tar -czf - --exclude=node_modules server deploy/brief | ssh -o BatchMode=yes "$DEPLOY_USER@$DEPLOY_HOST" "brief $TARGET $GITHUB_SHA"
        env:
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
