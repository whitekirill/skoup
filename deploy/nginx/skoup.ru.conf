# skoup.ru — /etc/nginx/sites-available/skoup.ru (+ ссылка в sites-enabled). www и http → https://skoup.ru
server {
    listen 80;
    server_name skoup.ru www.skoup.ru;
    return 301 https://skoup.ru$request_uri;
}

server {
    listen 443 ssl http2;
    server_name www.skoup.ru;

    ssl_certificate /etc/letsencrypt/live/skoup.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/skoup.ru/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    return 301 https://skoup.ru$request_uri;
}

server {
    listen 443 ssl http2;
    server_name skoup.ru;

    ssl_certificate /etc/letsencrypt/live/skoup.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/skoup.ru/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    root /srv/skoup/prod/current;
    include /etc/nginx/snippets/skoup-site.conf;

    location /api/brief/ {
        proxy_pass http://10.128.0.4:3200;
        include /etc/nginx/snippets/skoup-brief-proxy.conf;
    }
}
