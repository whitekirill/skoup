# Прокси на сервис брифа на brim — /etc/nginx/snippets/skoup-brief-proxy.conf, подключается в location /api/brief/
client_max_body_size 260m;          # 5 файлов по 50 МБ и поля
proxy_request_buffering off;        # загрузка сразу идёт на brim, не копится на gw
proxy_read_timeout 900s;
proxy_send_timeout 900s;
limit_req zone=skoup_brief burst=10 nodelay;
limit_req_status 429;
proxy_set_header Host $host;
proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto $scheme;
