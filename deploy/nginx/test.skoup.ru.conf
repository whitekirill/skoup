# test.skoup.ru — /etc/nginx/sites-available/test.skoup.ru (+ ссылка в sites-enabled). Пароль: /etc/nginx/skoup-test.htpasswd
server {
    listen 80;
    server_name test.skoup.ru;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name test.skoup.ru;

    ssl_certificate /etc/letsencrypt/live/test.skoup.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/test.skoup.ru/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # тестовый сайт — под паролем и закрыт от поисковиков
    auth_basic "test.skoup.ru";
    auth_basic_user_file /etc/nginx/skoup-test.htpasswd;
    add_header X-Robots-Tag "noindex, nofollow" always;

    root /srv/skoup/test/current;
    include /etc/nginx/snippets/skoup-site.conf;

    location /api/brief/ {
        proxy_pass http://10.128.0.4:3201;
        include /etc/nginx/snippets/skoup-brief-proxy.conf;
    }
}
