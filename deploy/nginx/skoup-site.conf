# Статичный сайт (сборка Astro) — /etc/nginx/snippets/skoup-site.conf, подключается в server {}
index index.html;
error_page 404 /404.html;

# заголовки безопасности (add_header в локациях ниже не используем — иначе эти перестанут наследоваться)
add_header X-Content-Type-Options nosniff always;
add_header Referrer-Policy strict-origin-when-cross-origin always;
add_header X-Frame-Options SAMEORIGIN always;
add_header Strict-Transport-Security "max-age=31536000" always;

gzip on;
gzip_types text/css application/javascript application/json image/svg+xml application/xml text/plain;

location / {
    # адреса без слеша на конце → со слешем (у файлов с расширением слеша нет)
    rewrite ^(/[^.]*[^/])$ $1/ permanent;
    try_files $uri $uri/ =404;
}

# файлы с хешем в имени — кешируются надолго
location /_astro/ {
    expires max;
    try_files $uri =404;
}

location = /404.html {
    internal;
}
